name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # The ffmpeg-backed integration suite (src/__tests__/integration) needs
      # ffmpeg; install it on the Linux leg and make its absence a failure there.
      # The Windows leg skips that suite.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      # Report advisories in shipped (non-dev) dependencies without blocking
      # the build; a new upstream advisory should not fail an unrelated PR.
      - name: npm audit (production deps)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
        env:
          REQUIRE_FFMPEG: ${{ runner.os == 'Linux' && '1' || '' }}

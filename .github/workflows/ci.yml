name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Re-run on any ref, e.g. when a push to main started no runs; a green
  # dispatched run on main also releases.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    env:
      # The Windows leg runs the integration suite against FFmpeg 8 (the
      # whisper filter, gfxcapture) plus a real capture smoke test (#192).
      FFMPEG_VERSION: "8.1.1"
      FFMPEG_SHA256: 7a6c3e86f54b0dd3bceff31f81bf3b70397171fcf35d1a13b9ed9cbf1040fc18
      WHISPER_MODEL: ggml-tiny.en.bin
      WHISPER_SHA256: 921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f
      # The Linux legs run FFmpeg 8 too (#260), not Ubuntu's apt ffmpeg (6.x),
      # so both platforms test the version the README requires. BtbN's linux64
      # GPL static build from a month-end autobuild release (those are kept,
      # unlike the dailies), pinned by SHA-256 like the arm64 leg below.
      FFMPEG_LINUX_RELEASE: autobuild-2026-09-30-13-08
      FFMPEG_LINUX_ASSET: ffmpeg-n8.1.3-9-g29e619e767-linux64-gpl-8.1
      FFMPEG_LINUX_SHA256: 97ce978979194b5cf7e06a5e68020dbdaa7a4f3294c5452b6a1bc347100dbb79
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # The ffmpeg-backed integration suite (src/__tests__/integration) needs
      # ffmpeg; both legs install FFmpeg 8 and make its absence a failure.
      - name: Cache FFmpeg 8 (Linux)
        if: runner.os == 'Linux'
        id: linuxcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-linux
          key: ffmpeg-linux-${{ env.FFMPEG_LINUX_SHA256 }}
      - name: Download FFmpeg 8 (Linux)
        if: runner.os == 'Linux' && steps.linuxcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive="${FFMPEG_LINUX_ASSET}.tar.xz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_LINUX_RELEASE}/${archive}"
          echo "${FFMPEG_LINUX_SHA256}  ${archive}" | sha256sum -c -
          tar -xJf "$archive"
          mv "$FFMPEG_LINUX_ASSET" ffmpeg-linux
          rm "$archive"
      - name: Put FFmpeg 8 on PATH (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          echo "$RUNNER_TEMP/ffmpeg-linux/bin" >> "$GITHUB_PATH"
          version="$("$RUNNER_TEMP/ffmpeg-linux/bin/ffmpeg" -hide_banner -version | head -1)"
          echo "$version"
          # Fail fast if the pin ever stops being FFmpeg 8.
          case "$version" in "ffmpeg version n8."*) ;; *) echo "::error::expected FFmpeg 8, got: $version"; exit 1 ;; esac

      - name: Cache FFmpeg and the whisper model (Windows)
        if: runner.os == 'Windows'
        id: wincache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/media-tools
          key: media-tools-ffmpeg-${{ env.FFMPEG_VERSION }}-${{ env.WHISPER_MODEL }}
      - name: Download FFmpeg 8 and the whisper model (Windows)
        if: runner.os == 'Windows' && steps.wincache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/media-tools"
          mkdir -p "$dir"
          cd "$dir"
          archive="ffmpeg-${FFMPEG_VERSION}-full_build-shared.7z"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/GyanD/codexffmpeg/releases/download/${FFMPEG_VERSION}/${archive}"
          echo "${FFMPEG_SHA256}  ${archive}" | sha256sum -c -
          7z x -y "$archive" > /dev/null
          mv ffmpeg-*-full_build-shared ffmpeg
          rm "$archive"
          curl -fsSL --retry 3 -o "$WHISPER_MODEL" "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/${WHISPER_MODEL}"
          echo "${WHISPER_SHA256}  ${WHISPER_MODEL}" | sha256sum -c -
      - name: Put FFmpeg 8 on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dir="$(cygpath -m "$RUNNER_TEMP")/media-tools"
          echo "$dir/ffmpeg/bin" >> "$GITHUB_PATH"
          echo "SCREENCAST_WHISPER_MODEL=$dir/$WHISPER_MODEL" >> "$GITHUB_ENV"
          "$dir/ffmpeg/bin/ffmpeg.exe" -hide_banner -version | head -1

      - run: npm ci
      # Report advisories in shipped (non-dev) dependencies without blocking
      # the build; a new upstream advisory should not fail an unrelated PR.
      - name: npm audit (production deps)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
      # The release attaches a Claude Desktop bundle; build it here too so a
      # packaging break shows up on the PR, not at release time.
      - name: Build the .mcpb bundle (smoke)
        if: runner.os == 'Linux' && matrix.node-version == 22
        run: node scripts/build-mcpb.mjs mcpb-out
      - run: npm run typecheck
      - run: npm test
        if: ${{ !(runner.os == 'Windows' && matrix.node-version == 22) }}
        env:
          REQUIRE_FFMPEG: "1"
          RUN_CAPTURE_SMOKE: ${{ runner.os == 'Windows' && '1' || '' }}
      # The same suite with v8 coverage on one leg (#261). The floor for
      # src/utils lives in vitest.config.ts; dropping below it fails the run.
      - name: npm test with coverage (Windows, Node 22)
        if: runner.os == 'Windows' && matrix.node-version == 22
        run: npm run test:coverage
        env:
          REQUIRE_FFMPEG: "1"
          RUN_CAPTURE_SMOKE: "1"
      - name: Coverage summary
        if: ${{ !cancelled() && runner.os == 'Windows' && matrix.node-version == 22 && hashFiles('coverage/coverage-summary.json') != '' }}
        shell: bash
        run: |
          node -e '
            const s = require("./coverage/coverage-summary.json");
            const pct = (m) => `${m.pct}% (${m.covered}/${m.total})`;
            const utils = { lines: { total: 0, covered: 0 } };
            for (const [file, m] of Object.entries(s)) {
              if (/[\\/]src[\\/]utils[\\/]/.test(file)) { utils.lines.total += m.lines.total; utils.lines.covered += m.lines.covered; }
            }
            const u = utils.lines.total ? (100 * utils.lines.covered / utils.lines.total).toFixed(2) : "n/a";
            const t = s.total;
            console.log([
              "## Coverage (Windows, Node 22)", "",
              "| Scope | Lines | Statements | Functions | Branches |", "| --- | --- | --- | --- | --- |",
              `| all of src | ${pct(t.lines)} | ${pct(t.statements)} | ${pct(t.functions)} | ${pct(t.branches)} |`,
              `| src/utils | ${u}% (${utils.lines.covered}/${utils.lines.total}) | | | |`,
            ].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

  # Windows on ARM64 (#246): unit + ffmpeg integration suites and the gdigrab
  # capture smoke test on a native arm64 runner and arm64 Node. gyan.dev ships
  # no arm64 build, so this uses BtbN's FFmpeg 8.1 winarm64 GPL static build
  # from a month-end autobuild release (those are kept, unlike the dailies),
  # pinned by SHA-256. The shared build's ffmpeg.exe exited silently on the
  # runner (no version output), so the static one avoids loading the DLLs.
  # It has gdigrab, gfxcapture and drawtext but is built
  # --disable-whisper and without libvpx, so transcribe and .webm output are
  # not covered here. Lint and typecheck are arch-independent and run above.
  windows-arm64:
    runs-on: windows-11-arm
    # Not yet proven green on the hosted ARM runner (#246). release.yml waits
    # for a successful CI run, so until it is, a failure here must not block
    # releases. Drop this once the leg has passed.
    continue-on-error: true
    env:
      FFMPEG_ARM64_RELEASE: autobuild-2026-09-30-13-08
      FFMPEG_ARM64_ASSET: ffmpeg-n8.1.3-9-g29e619e767-winarm64-gpl-8.1
      FFMPEG_ARM64_SHA256: 061a770557c30bbf8e0b6ca3810288a60f72b85088378b84be03277746f34f17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Cache FFmpeg (arm64)
        id: armcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-arm64
          key: ffmpeg-arm64-${{ env.FFMPEG_ARM64_SHA256 }}
      - name: Download FFmpeg 8.1 (arm64)
        if: steps.armcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP "$env:FFMPEG_ARM64_ASSET.zip"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/$env:FFMPEG_ARM64_RELEASE/$env:FFMPEG_ARM64_ASSET.zip" -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:FFMPEG_ARM64_SHA256) { throw "FFmpeg checksum mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP
          Move-Item (Join-Path $env:RUNNER_TEMP $env:FFMPEG_ARM64_ASSET) (Join-Path $env:RUNNER_TEMP 'ffmpeg-arm64')
          Remove-Item $zip
      - name: Put FFmpeg on PATH (arm64)
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'ffmpeg-arm64/bin'
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          $version = & (Join-Path $bin 'ffmpeg.exe') -hide_banner -version | Select-Object -First 1
          $code = $LASTEXITCODE
          # Fail here, not 30 tests later, when ffmpeg.exe will not start
          # (e.g. 0xC0000135, a DLL it needs is missing).
          if (-not $version) { throw ("ffmpeg.exe printed nothing (exit code {0} / 0x{0:X8})" -f $code) }
          $version
          node -p "'node ' + process.version + ' ' + process.arch"
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          REQUIRE_FFMPEG: "1"
          RUN_CAPTURE_SMOKE: "1"
      # Report what the server sees on arm64: doctor (filters, devices, OCR
      # languages), an OCR round trip through Windows.Media.Ocr on a rendered
      # file, and full-screen grabs with gdigrab and WGC. Report-only: WGC on
      # a hosted runner's session is not something CI should gate on.
      - name: Platform probe (arm64)
        continue-on-error: true
        run: node scripts/platform-probe.mjs --capture

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # NPM_TOKEN is provisioned, so the publish step runs. The guard remains so
      # that if the secret is ever rotated out or removed, the publish step skips
      # cleanly rather than leaving a perpetually-red post-merge workflow.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      # Set the repository variable NPM_TRUSTED_PUBLISHING=true once npm trusted
      # publishing is configured for this repo + publish.yml on npmjs.com. npm
      # then authenticates with GitHub OIDC (id-token: write): no token, no OTP.
      TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5+; a major pin keeps an unreviewed npm
      # major out of the job that holds the OIDC token (#191).
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Check if this version is already published
        id: pub
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$name@$ver is already on npm; skipping publish (idempotent re-dispatch)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          # A late release of an older version must not move npm's latest tag
          # back (#190).
          current=$(npm view "$name" version 2>/dev/null || echo 0.0.0)
          newest=$(printf '%s\n%s\n' "$current" "$ver" | sort -V | tail -1)
          echo "dist_tag=$([ "$newest" = "$ver" ] && echo latest || echo backport)" >> "$GITHUB_OUTPUT"

      - name: Skip publish (no NPM_TOKEN or trusted publishing configured)
        if: env.HAS_NPM_TOKEN != 'true' && env.TRUSTED != 'true'
        run: |
          echo "NPM_TOKEN is not configured for this repository."
          echo "Build and tests passed, but nothing was published to npm."
          echo "To enable publishing, add an NPM_TOKEN secret (or configure npm"
          echo "trusted publishing for this repo) and re-run this workflow."

      - name: Publish to npm
        if: steps.pub.outputs.skip == 'false' && (env.HAS_NPM_TOKEN == 'true' || env.TRUSTED == 'true')
        run: |
          set -o pipefail
          if npm publish --provenance --access public --tag "${{ steps.pub.outputs.dist_tag }}" 2>&1 | tee publish.log; then exit 0; fi
          if grep -q EOTP publish.log; then
            echo "::error::npm asked for a one-time password: NPM_TOKEN is a 2FA-protected token, which CI cannot use. Configure npm trusted publishing (npmjs.com > package > Settings > Trusted publishing: GitHub Actions, this repo, publish.yml) and set the repository variable NPM_TRUSTED_PUBLISHING=true."
          fi
          exit 1
        env:
          # With trusted publishing, no token: npm uses the OIDC identity instead.
          NODE_AUTH_TOKEN: ${{ env.TRUSTED != 'true' && secrets.NPM_TOKEN || '' }}

      # List the release in the official MCP Registry (#90). The registry checks
      # that the npm package's mcpName matches server.json, and it reads npm, so
      # this waits until npm serves the version (a fresh publish takes a minute
      # to appear). It runs whenever the registry lacks this version, so a
      # re-dispatch also repairs a release whose listing failed. Auth is GitHub
      # OIDC (id-token: write), which grants the io.github.TMHSDigital/*
      # namespace; no secret needed. mcp-publisher is pinned and checksum-verified.
      - name: Publish to the MCP Registry
        if: env.HAS_NPM_TOKEN == 'true' || env.TRUSTED == 'true'
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          v=$(node -p "require('./package.json').version")
          name=$(jq -r .name server.json)
          # Search misses names containing a slash; the per-name versions list
          # works. A 404 (never listed) falls through to publishing.
          enc=$(jq -rn --arg n "$name" '$n | @uri')
          if curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers/${enc}/versions" 2>/dev/null \
            | jq -e --arg v "$v" '[.servers[] | (.server // .) | select(.version == $v)] | length > 0' >/dev/null; then
            echo "$name $v is already in the MCP Registry."
            exit 0
          fi
          pkg=$(node -p "require('./package.json').name")
          for i in $(seq 1 30); do
            if [ "$(npm view "$pkg@$v" version --prefer-online 2>/dev/null)" = "$v" ]; then break; fi
            echo "Waiting for npm to serve $pkg@$v ($i/30)..."
            sleep 10
          done
          jq --arg v "$v" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          tarball=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -o "$tarball" "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${tarball}"
          echo "${MCP_PUBLISHER_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

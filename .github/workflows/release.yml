name: Release

# Runs only after CI passes on a push to main, and releases exactly the
# commit CI tested (#190). A manual dispatch releases the dispatched ref.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag-and-release:
    name: Tag and release
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      # The default GITHUB_TOKEN (contents: write) pushes tags and creates the
      # release. CI never writes to main; bump the version in the commit
      # itself. A GITHUB_TOKEN release does not trigger publish.yml,
      # so this job dispatches it explicitly afterward.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Read version from package.json
        id: ver
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "package.json version: $v"

      - name: Check if tag already exists
        id: check
        run: |
          if git rev-parse "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.ver.outputs.version }} exists; nothing to release."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag, release, and trigger publish
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          IFS='.' read -r major minor _patch <<< "$v"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$v"
          git push origin "v$v"
          # A CI run that finishes late can release an older version after a
          # newer one; the floating tags move only for the newest release.
          newest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ "$newest" = "v$v" ]; then
            git tag -f "v$major"
            git tag -f "v$major.$minor"
            git push origin "v$major" --force
            git push origin "v$major.$minor" --force
          fi
          latest=$([ "$newest" = "v$v" ] && echo true || echo false)
          # The release body is this version's curated CHANGELOG section (#219):
          # everything under "## [x.y.z]" (an optional " - YYYY-MM-DD" date may
          # follow) up to the next "## " heading. Without a section, fall back
          # to GitHub's generated notes so a release never ships empty.
          awk -v want="## [$v]" '
            index($0, want) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if grep -q '[^[:space:]]' release-notes.md; then
            gh release create "v$v" --title "v$v" --notes-file release-notes.md --latest="$latest"
          else
            echo "::warning::CHANGELOG.md has no [$v] section; using generated notes."
            gh release create "v$v" --title "v$v" --generate-notes --latest="$latest"
          fi
          # Publish builds the tag, not main: main may already be at a newer
          # version by the time it runs (#190). publish.yml is idempotent
          # (skips an already-published version), so a duplicate is harmless.
          gh workflow run publish.yml --ref "v$v"

      # Attach a one-click Claude Desktop bundle (.mcpb) to the release (#127),
      # plus an unversioned screencast-mcp.mcpb copy so
      # releases/latest/download/screencast-mcp.mcpb is a stable link (#216).
      # It does not depend on npm, so it ships even if the npm publish fails.
      - name: Set up Node for the bundle
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Build and attach the .mcpb bundle
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node scripts/build-mcpb.mjs mcpb-out
          gh release upload "v${{ steps.ver.outputs.version }}" mcpb-out/*.mcpb --clobber

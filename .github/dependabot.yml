version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # A zod major is a deliberate, manual upgrade: the MCP SDK turns these
      # schemas into each tool's inputSchema JSON, so a major bump can change
      # the emitted schema without failing the test suite (3 -> 4 was done by
      # diffing every tool's tools/list schema before and after, #86).
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      # Hold the TypeScript 5.x line: a major (6.x, or the native 7.x compiler)
      # is a deliberate migration, checked against `npm run typecheck` and lint.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # engines is >=22 and CI runs Node 22/24; keep @types/node on the oldest
      # supported runtime so code cannot use APIs Node 22 lacks.
      - dependency-name: "@types/node"
        versions: [">=23"]
